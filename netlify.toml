# Netlify deployment for the Aria Noir landing page.
#
# @netlify/plugin-nextjs handles the Next.js build output (App Router, image
# optimisation, and the static/prerendered routes) — do not set `publish`
# yourself; the plugin wires it up.

[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  # The 3D models and hero video are large; give the build room.
  NODE_OPTIONS = "--max-old-space-size=4096"

# Long-cache the immutable build output.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static art: hashed by content change rather than filename, so keep the TTL
# moderate and let revalidation handle updates.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/logo/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
